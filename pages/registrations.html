<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EQAS Program Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .program-card { transition: all 0.3s ease; cursor: pointer; }
    .program-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,77,153,0.15); }
    .modal-overlay { z-index: 1000; background: rgba(0,0,0,.6); backdrop-filter: blur(5px); transition: opacity .3s; }
    .modal-content { max-height: 90vh; }
    .modal-content-overflow { overflow-y: auto; }
    @media (min-width:1024px){ .sidebar-height{ height:100vh; position:sticky; top:0; } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md z-10">
    <div class="px-4 sm:px-6 lg:px-8 lg:ml-[250px] py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-blue-800">NCG QAP-DL Dashboard</h1>
      <span class="text-sm text-gray-500">Admin</span>
    </div>
  </header>

  <div class="flex flex-grow w-full">
    <!-- Sidebar -->
    <aside class="sidebar-height w-full lg:w-[250px] mb-8 lg:mb-0 bg-white p-6 shadow-xl border-t-4 lg:border-t-0 lg:border-r border-gray-300 flex-shrink-0">
      <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-3">Admin</h3>
      <nav class="space-y-3">
        <a href="./registrations.html" class="flex items-center p-3 rounded-lg bg-blue-50 text-blue-700 font-semibold hover:bg-blue-100">
          <span class="mr-3 text-2xl">📝</span> Registrations
        </a>
        <a href="./programs.html" class="flex items-center p-3 rounded-lg text-gray-700 hover:bg-gray-100">
          <span class="mr-3 text-2xl text-teal-600">✅</span> Programs
        </a>
        <a href="#" class="flex items-center p-3 rounded-lg text-gray-700 hover:bg-gray-100">
          <span class="mr-3 text-2xl text-pink-600">📢</span> Announcements
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="flex-grow py-12 px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-3xl font-extrabold text-gray-900">Registrations</h2>
      </div>

      <!-- Bucket Tabs -->
      <div class="mb-6">
        <div class="inline-flex rounded-xl border border-gray-200 bg-white shadow-sm overflow-hidden">
          <button id="tabNew"
                  class="px-4 py-2 text-sm font-semibold bg-blue-600 text-white focus:outline-none">
            New Registrations
          </button>
          <button id="tabAll"
                  class="px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50 focus:outline-none">
            All Centers
          </button>
        </div>
      </div>

      <!-- Bucket: New Registrations -->
      <section id="bucket-new" class="bg-white shadow-md rounded-2xl border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">NCG Member</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Center Name</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Address</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Email of Contact</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Approval Status</th>
              </tr>
            </thead>
            <tbody id="reg-rows" class="bg-white divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </section>

      <!-- Bucket: All Centers -->
      <section id="bucket-all" class="hidden bg-white shadow-md rounded-2xl border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Center Code</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Center Name</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Address</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Email of Contact</th>
              </tr>
            </thead>
            <tbody id="all-rows" class="bg-white divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6 mt-auto">
    <div class="px-4 sm:px-6 lg:px-8 lg:ml-[250px] text-center lg:text-left">
      <p class="text-sm">&copy; 2025 EQAS Solutions. Quality Assurance for Laboratory Excellence.</p>
    </div>
  </footer>

  <!-- Approve Modal -->
  <div id="approveModal" class="fixed inset-0 hidden modal-overlay flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-[95%] max-w-2xl modal-content">
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <h3 class="text-xl font-semibold text-gray-900">Approve Center</h3>
        <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">&times;</button>
      </div>
      <form id="approveForm" class="px-6 py-5 modal-content-overflow">
        <input type="hidden" id="rowId" />
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Center Name</label>
            <input id="centerName" class="mt-1 w-full rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500" type="text" readonly>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input id="centerEmail" class="mt-1 w-full rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500" type="email" readonly>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Subject</label>
            <input id="emailSubject" class="mt-1 w-full rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500" type="text">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Body</label>
            <textarea id="emailBody" rows="6" class="mt-1 w-full rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">Send & Approve</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- Demo data (replace with your real data/wire-up later) ---
    const registrations = [
      // New/Pending
      { id: 1, ncgMember: "Yes", centerName: "Tata Memorial Hospital", address: "Parel, Mumbai, MH", email: "tmh@example.org", status: "Pending", centerCode: "" },
      { id: 2, ncgMember: "No",  centerName: "City Cancer Center",    address: "Sector 21, New Delhi", email: "contact@ccc.example.in", status: "Pending", centerCode: "" },
      { id: 3, ncgMember: "Yes", centerName: "Metro Onco Labs",       address: "Kalyani Nagar, Pune", email: "info@metroonco.in", status: "Pending", centerCode: "" },

      // Pre-existing Approved (All Centers)
      { id: 101, ncgMember: "Yes", centerName: "Tata Medical Center", address: "New Town, Kolkata, WB", email: "tmc-kolkata@example.org", status: "Approved", centerCode: "CEN-0101" },
      { id: 102, ncgMember: "Yes", centerName: "AIIMS, New Delhi", address: "Ansari Nagar, New Delhi", email: "aiims-delhi@example.org", status: "Approved", centerCode: "CEN-0102" },
      { id: 103, ncgMember: "Yes", centerName: "Rajiv Gandhi Cancer Institute", address: "Rohini, New Delhi", email: "rgci@example.org", status: "Approved", centerCode: "CEN-0103" },
      { id: 104, ncgMember: "Yes", centerName: "HCG Cancer Centre", address: "Sampangiram Nagar, Bengaluru, KA", email: "hcg-blr@example.org", status: "Approved", centerCode: "CEN-0104" },
      { id: 105, ncgMember: "Yes", centerName: "Adyar Cancer Institute", address: "Adyar, Chennai, TN", email: "aci-chennai@example.org", status: "Approved", centerCode: "CEN-0105" },
      { id: 106, ncgMember: "Yes", centerName: "KIMS Hospitals", address: "Minister Rd, Secunderabad, Hyderabad, TS", email: "kims-hyd@example.org", status: "Approved", centerCode: "CEN-0106" },
      { id: 107, ncgMember: "Yes", centerName: "Max Super Speciality Hospital, Saket", address: "Saket, New Delhi", email: "max-saket@example.org", status: "Approved", centerCode: "CEN-0107" },
      { id: 108, ncgMember: "Yes", centerName: "Amrita Institute of Medical Sciences", address: "Ponekkara, Kochi, KL", email: "aims-kochi@example.org", status: "Approved", centerCode: "CEN-0108" },
      { id: 109, ncgMember: "Yes", centerName: "PGIMER", address: "Sector 12, Chandigarh", email: "pgimer@example.org", status: "Approved", centerCode: "CEN-0109" }
    ];


    // simple code generator for approved centers
    let nextCode = (() => {
      const max = registrations.reduce((acc, r) => {
        const m = /CEN-(\d{4})/.exec(r.centerCode || "");
        return m ? Math.max(acc, parseInt(m[1], 10)) : acc;
      }, 0);
      return (max || 0) + 1;
    })();


    function generateCenterCode() {
      return `CEN-${String(nextCode++).padStart(4, '0')}`;
    }

    // ----- ELEMENTS -----
    const rowsEl = document.getElementById("reg-rows");
    const allRowsEl = document.getElementById("all-rows");
    const approveModal = document.getElementById("approveModal");
    const approveForm = document.getElementById("approveForm");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const tabNew = document.getElementById("tabNew");
    const tabAll = document.getElementById("tabAll");
    const bucketNew = document.getElementById("bucket-new");
    const bucketAll = document.getElementById("bucket-all");

    const rowIdInput = document.getElementById("rowId");
    const centerNameInput = document.getElementById("centerName");
    const centerEmailInput = document.getElementById("centerEmail");
    const emailSubjectInput = document.getElementById("emailSubject");
    const emailBodyInput = document.getElementById("emailBody");

    // ----- RENDERERS -----
    function statusBadge(status) {
      const map = {
        "Approved": "bg-green-100 text-green-800 border-green-200",
        "Disapproved": "bg-red-100 text-red-800 border-red-200",
        "Pending": "bg-yellow-100 text-yellow-800 border-yellow-200"
      };
      const cls = map[status] || map["Pending"];
      return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border ${cls}">${status}</span>`;
    }

    function actionButtons(id) {
      return `
        <div class="flex gap-2">
          <button class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700"
                  onclick="openApproveModal(${id})">Approve</button>
          <button class="px-3 py-1.5 rounded-lg bg-red-600 text-white text-sm hover:bg-red-700"
                  onclick="disapproveRow(${id})">Disapprove</button>
        </div>
      `;
    }

    function renderNewRows() {
      rowsEl.innerHTML = registrations.map(r => {
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 text-gray-900">${r.ncgMember}</td>
            <td class="px-4 py-3 text-gray-900 font-medium">${r.centerName}</td>
            <td class="px-4 py-3 text-gray-700">${r.address}</td>
            <td class="px-4 py-3">
              <a class="text-blue-700 hover:underline" href="mailto:${r.email}">${r.email}</a>
            </td>
            <td class="px-4 py-3">
              ${r.status === "Pending" ? actionButtons(r.id) : statusBadge(r.status)}
            </td>
          </tr>
        `;
      }).join("");
    }

    function renderAllRows() {
      const approved = registrations.filter(r => r.status === "Approved");
      allRowsEl.innerHTML = approved.map(r => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-semibold text-gray-900">${r.centerCode || "-"}</td>
          <td class="px-4 py-3 text-gray-900">${r.centerName}</td>
          <td class="px-4 py-3 text-gray-700">${r.address}</td>
          <td class="px-4 py-3">
            <a class="text-blue-700 hover:underline" href="mailto:${r.email}">${r.email}</a>
          </td>
        </tr>
      `).join("");
    }

    function renderAll() {
      renderNewRows();
      renderAllRows();
    }

    // ----- BUCKET SWITCHING -----
    function setBucket(view) {
      if (view === "new") {
        bucketNew.classList.remove("hidden");
        bucketAll.classList.add("hidden");
        tabNew.classList.add("bg-blue-600","text-white");
        tabAll.classList.remove("bg-blue-600","text-white");
        tabAll.classList.add("text-gray-700");
      } else {
        bucketNew.classList.add("hidden");
        bucketAll.classList.remove("hidden");
        tabAll.classList.add("bg-blue-600","text-white");
        tabNew.classList.remove("bg-blue-600","text-white");
        tabNew.classList.add("text-gray-700");
      }
    }

    tabNew.addEventListener("click", () => setBucket("new"));
    tabAll.addEventListener("click", () => setBucket("all"));

    // ----- APPROVE FLOW -----
    window.openApproveModal = function(id) {
      const row = registrations.find(x => x.id === id);
      if (!row) return;

      rowIdInput.value = id;
      centerNameInput.value = row.centerName;
      centerEmailInput.value = row.email;
      emailSubjectInput.value = "EQAS NCG – Enrollment Approval and Login Details";
      emailBodyInput.value =
`Dear ${row.centerName},

Thank you for registering with EQAS NCG. Here are your login details:

• Portal: https://eqas.example.org/submit
• Participant ID:
• Access Code:

Please keep this information confidential. For any assistance, reply to this email.

Regards,
EQAS NCG Team`;

      approveModal.classList.remove("hidden");
    };

    function closeApproveModal() {
      approveModal.classList.add("hidden");
    }
    closeModalBtn.addEventListener("click", closeApproveModal);
    cancelModalBtn.addEventListener("click", closeApproveModal);

    approveForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const id = Number(rowIdInput.value);
      const row = registrations.find(x => x.id === id);
      if (!row) return;

      // Simulate sending email; then approve and set center code
      if (!row.centerCode) row.centerCode = generateCenterCode();
      row.status = "Approved";

      renderAll();          // refresh both tables
      closeApproveModal();

      // Optional: Switch to "All Centers" to show result
      setBucket("all");
    });

    // ----- DISAPPROVE FLOW -----
    window.disapproveRow = function(id) {
      const row = registrations.find(x => x.id === id);
      if (!row) return;

      const ok = confirm(`Disapprove "${row.centerName}"?`);
      if (!ok) return;

      row.status = "Disapproved";
      renderAll();
    };

    // Initial render & default bucket
    renderAll();
    setBucket("new");
  </script>
</body>
</html>
